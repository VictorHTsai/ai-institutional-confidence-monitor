<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b1420"><title>AI Institutional Confidence Monitor</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:#dce7ef;background:#0b1420;font-size:15px}*{box-sizing:border-box}body{margin:0}main{max-width:1240px;margin:auto;padding:34px 24px 70px}a{color:#83c9e6}header{border-bottom:1px solid #2b3a49;padding-bottom:24px;display:flex;justify-content:space-between;gap:20px;align-items:center}.eyebrow{color:#79b9c7;font-size:11px;letter-spacing:2px}h1{font-size:clamp(26px,4vw,40px);font-weight:650;letter-spacing:-1px;margin:12px 0}h2{font-size:18px;margin:0 0 16px}h3{font-size:14px;margin:0 0 10px}p{line-height:1.8}.muted{color:#93a7b7}.small{font-size:12px;line-height:1.7}.badge{white-space:nowrap;font-size:12px;border:1px solid #776142;border-radius:20px;padding:10px 16px;color:#edc185}.notice{background:#25251f;border-left:3px solid #d6b36e;padding:16px 20px;margin:24px 0;line-height:1.8;color:#e0cda4}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{border:1px solid #293c4c;background:#101e2c;border-radius:12px;padding:22px}.label{color:#97adbd;font-size:12px}.num{font-size:30px;letter-spacing:-.8px;margin:14px 0 5px;font-weight:600}.panel{margin-top:18px}.row{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:center}select,button{background:#152b3a;color:#e3eff5;border:1px solid #416171;border-radius:7px;padding:10px;font:inherit;font-size:13px}button{cursor:pointer}.chart{width:100%;height:auto;min-height:230px;touch-action:manipulation}.chart text{fill:#8ba4b6;font-size:11px}.chart circle{cursor:pointer}.details{min-height:56px;border-top:1px solid #293c4c;padding-top:12px;line-height:1.8}.two{display:grid;grid-template-columns:1.45fr 1fr;gap:18px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px;text-align:left}td,th{padding:13px 10px;border-bottom:1px solid #293c4c;white-space:nowrap}th{color:#8da7bb;font-weight:400}.positive{color:#7fd4bd}.negative{color:#efa29b}.stock{padding:4px 8px;font-weight:650}.bar-row{display:grid;grid-template-columns:105px 1fr 60px;gap:12px;margin:17px 0;align-items:center;font-size:12px}.bar-track{height:9px;background:#263c48;border-radius:5px;overflow:hidden}.bar{height:100%;background:#73b8c3}.source-list{max-height:190px;overflow:auto}.error{padding:40px;color:#f2bdac}details{margin:15px 0;border-top:1px solid #293c4c;padding-top:15px}summary{cursor:pointer;color:#c0d5df}.foot{margin-top:28px;border-top:1px solid #293c4c;padding-top:20px;color:#91a7b8}.skeleton{padding:30px;color:#8eafbc}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}}@media(max-width:460px){main{padding:22px 14px}.card,.panel{padding:16px}.num{font-size:24px}.filters{gap:8px}select{max-width:100%}.badge{font-size:11px}.chart{min-height:190px}}
</style></head><body><main><header><div><div class="eyebrow">VICTOR INVESTMENT OS / RESEARCH MONITOR</div><h1>AI Institutional<br>Confidence Monitor</h1><div class="muted">AI 機構申報部位監測 · SEC Form 13F</div></div><div class="badge">受限樣本 · 非整體機構資金流</div></header><div class="notice"><b>先讀這個：</b>本頁比較連續申報、符合保守篩選條件的管理人長股部位。它排除許多大型共同管理與混合型機構，<b>不能代表所有機構、避險基金淨曝險或全球 AI 資金</b>。美元數字是申報部位變化的估值，不是實際投入的現金。</div><div id="app" class="skeleton">載入已處理的 SEC 歷史申報資料…</div><footer class="foot small">資料與可重現程式：<a href="https://github.com/VictorHTsai/ai-institutional-confidence-monitor">GitHub</a> · <a href="METHODOLOGY.md">完整方法</a> · <a href="RELEASE_ASSESSMENT.md">發布驗證與未完成項目</a> · <a href="UNIVERSE.md">選股政策</a></footer></main><script>
'use strict';
let D,selected='core';const names={core:'固定 2021 核心籃子',compute:'AI 運算與半導體',platforms:'成熟平台與雲端',software:'AI 軟體與變現',incumbent_cloud:'ORCL 獨立觀察',infrastructure:'AI 基建轉型／neocloud'};
const el=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(v,n=1)=>v==null?'—':Number(v).toLocaleString('en-US',{maximumFractionDigits:n,minimumFractionDigits:n});
const signed=v=>v==null?'—':(v>=0?'+':'')+fmt(v)+'%';const money=v=>v==null?'—':(v<0?'−':'')+'$'+fmt(Math.abs(v)/1e9,2)+'B';
function series(t){return D.series.filter(r=>r.ticker===t).sort((a,b)=>a.quarter.localeCompare(b.quarter))}
function chart(rows,field,id,color='#7ac8cc'){
 const width=920,height=290,left=55,right=24,top=25,bottom=40;const vals=rows.map(r=>r[field]);if(field!=='index')vals.push(0);let lo=Math.min(...vals),hi=Math.max(...vals);let span=hi-lo||Math.abs(hi)*.1||1;lo-=span*.12;hi+=span*.12;
 const x=i=>left+i*(width-left-right)/(rows.length-1||1),y=v=>top+(hi-v)*(height-top-bottom)/(hi-lo);let svg='';
 for(let i=0;i<5;i++){const v=lo+(hi-lo)*i/4,yy=y(v);svg+=`<line x1="${left}" y1="${yy}" x2="${width-right}" y2="${yy}" stroke="#263c4c"/><text x="${left-8}" y="${yy+4}" text-anchor="end">${field==='index'?fmt(v,0):fmt(v/1e9,1)+'B'}</text>`}
 rows.forEach((r,i)=>{if(i===0||i===rows.length-1||r.quarter.endsWith('12-31'))svg+=`<text x="${x(i)}" y="${height-12}" text-anchor="middle">${r.quarter.slice(0,4)} Q${Math.ceil(Number(r.quarter.slice(5,7))/3)}</text>`});
 if(field==='index'){svg+=`<polyline points="${rows.map((r,i)=>x(i)+','+y(r[field])).join(' ')}" fill="none" stroke="${color}" stroke-width="3"/>`;rows.forEach((r,i)=>svg+=`<circle tabindex="0" role="button" aria-label="${r.quarter}，指數 ${fmt(r.index)}" data-i="${i}" cx="${x(i)}" cy="${y(r[field])}" r="5" fill="${color}" stroke="#101e2c" stroke-width="2"><title>${r.quarter}: ${fmt(r.index)}</title></circle>`)}
 else{const zero=y(0);svg+=`<line x1="${left}" y1="${zero}" x2="${width-right}" y2="${zero}" stroke="#8197a6"/>`;rows.forEach((r,i)=>{const yy=y(r[field]),w=Math.min(22,(width-left-right)/rows.length*.6);svg+=`<rect data-i="${i}" tabindex="0" role="button" aria-label="${r.quarter}，${money(r[field])}" x="${x(i)-w/2}" y="${Math.min(yy,zero)}" width="${w}" height="${Math.max(2,Math.abs(yy-zero))}" fill="${r[field]>=0?'#7bc9bb':'#db9e93'}"><title>${r.quarter}: ${money(r[field])}</title></rect>`})}
 el(id).innerHTML=svg;el(id).querySelectorAll('[data-i]').forEach(node=>{const show=()=>detail(rows[Number(node.dataset.i)]);node.addEventListener('click',show);node.addEventListener('focus',show);node.addEventListener('mouseenter',show);node.addEventListener('keydown',e=>{if(e.key==='Enter')show()})})}
function detail(r){el('point-detail').textContent=r.quarter+' · '+(names[r.ticker]||r.ticker)+' · 部位指數 '+fmt(r.index)+' · 單季部位變化估值 '+money(r.estimated_position_change_dollars)+(r.reference_price?' · SEC 隱含參考價 $'+fmt(r.reference_price,2):'');if(r.source_accessions){el('sources').innerHTML=r.source_accessions.slice(0,15).map(a=>{const cik=String(Number(a.split('-')[0]));return `<a href="https://www.sec.gov/Archives/edgar/data/${cik}/${a.replaceAll('-','')}/${a}-index.html" target="_blank" rel="noopener">${esc(a)}</a>`}).join('<br>')+`<p>本期 ${r.source_accessions.length} 個持有部位的來源申報；完整清單見下載資料。</p>`}else el('sources').textContent='選擇個股可查看納入樣本的原始 SEC 申報。'}
function paint(){selected=el('selection').value;const rows=series(selected),last=rows.at(-1),prev=rows.at(-2),peak=Math.max(...rows.map(r=>r.index));el('index').textContent=fmt(last.index);el('quarter-change').textContent=signed(100*(last.index/prev.index-1));el('estimated').textContent=money(last.estimated_position_change_dollars);el('base').textContent='基準 '+rows[0].quarter+' = 100';el('peak').textContent=fmt(100*(last.index/peak-1))+'%';el('chart-title').textContent=(names[selected]||selected)+'｜固定價格部位指數';chart(rows,'index','history');chart(rows.filter(r=>r.estimated_position_change_dollars!=null),'estimated_position_change_dollars','dollars');detail(last)}
function render(){el('app').className='';el('app').innerHTML=`<div class="cards"><div class="card"><div class="label">選定樣本部位指數</div><div class="num" id="index">—</div><div class="small muted" id="base"></div></div><div class="card"><div class="label">數量指數單季變化</div><div class="num" id="quarter-change">—</div><div class="small muted">同一組管理人與固定股權單位</div></div><div class="card"><div class="label">單季部位變化估值</div><div class="num" id="estimated">—</div><div class="small muted">SEC 隱含價格代理 · 非現金流入</div></div><div class="card"><div class="label">最新納入的持股報告期</div><div class="num">${D.latest_quarter}</div><div class="small muted">已匯入申報截至 ${D.publication_cutoff}</div></div></div><section class="panel"><div class="row"><h2 id="chart-title">歷史部位</h2><div class="filters"><label for="selection" class="small muted">產業／個股</label><select id="selection">${Object.entries(names).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}<optgroup label="個股探索">${D.stocks.map(s=>`<option value="${s.ticker}">${s.ticker}</option>`).join('')}</optgroup></select></div></div><p class="small muted">核心籃子自 2021 Q4 起固定；IPO／業務轉型公司採獨立起點。指數移除了股價漲跌，並不排除發行新股、併購換股等因素。點選或輕觸圖上資料點。</p><svg id="history" class="chart" viewBox="0 0 920 290" role="img" aria-label="季度固定價格部位指數"></svg><div id="point-detail" class="details small"></div></section><section class="two"><div class="panel"><h2>單季部位變化的美元估值</h2><p class="small muted">Δ 股數 × 當季 SEC 申報隱含價格的中位數。未使用成交價格，亦非獨立交易所收盤價。</p><svg id="dollars" class="chart" viewBox="0 0 920 290" role="img" aria-label="單季部位變化估值"></svg></div><div class="panel"><h2>樣本與分母</h2><p><b>${D.panel_managers}</b> 個管理人連續納入 19 季；篩選前連續申報管理人 ${D.continuous_managers_before_exclusions} 個。</p><div class="label">目前選定序列：部位存量距歷史高點</div><div class="num" id="peak">—</div><div class="label">2021 後累積部位尚餘百分比</div><div class="num">N/A</div><p class="small muted">尚未完成跨樣本穩健性驗證，因此不發布累積部位剩餘比例。圖上的存量回落與累積增持回吐是不同指標。</p></div></section><section class="panel"><h2>產業輪動｜同一管理人樣本</h2><div id="rotation"></div><p class="small muted">比較各固定組別的單季數量指數變化。不同組別同時增減不代表能追蹤到實際資金轉移；基建組別自所有衛星標的均有可用資料的季度開始。</p></section><section class="panel"><h2>個股探索</h2><div class="table-wrap"><table><thead><tr><th>標的</th><th>組別</th><th>起始季</th><th>拆股調整後股數</th><th>部位指數</th><th>單季股數變化</th></tr></thead><tbody>${D.stocks.map(s=>`<tr><td><button class="stock" data-stock="${s.ticker}">${s.ticker}</button></td><td>${names[s.group]}</td><td>${s.baseline}</td><td>${fmt(s.latest_shares,0)}</td><td>${fmt(s.latest_index)}</td><td class="${s.qoq_pct>=0?'positive':'negative'}">${signed(s.qoq_pct)}</td></tr>`).join('')}</tbody></table></div><p class="small muted">TSM 僅限美國申報 ADR；GOOG 與 GOOGL 保留不同股別。核心總指數按固定基準估值加總兩者，沒有把 Alphabet 的持股重複計算。</p></section><section class="two"><div class="panel"><h2>證據與解讀</h2><div id="interpretation"></div><p class="small muted">J.P. Morgan 的 10/17 假說涉及近期賣出與融資壓力。本資料最新部位日為 6/30，無法驗證 9–10 月交易，更無法重建 Prime Brokerage 的避險基金淨曝險。</p></div><div class="panel"><h2>融資與風險偏好</h2><p class="small">可查核原始文件：<a href="https://www.sec.gov/Archives/edgar/data/1769628/000176962826000366/crwv-20260630.htm">CoreWeave 2026 Q2 10-Q</a>、<a href="https://www.sec.gov/Archives/edgar/data/1878848/000187884826000052/iren-20260630.htm">IREN FY2026 10-K</a>。</p><p class="small muted">尚未建成跨公司的同口徑槓桿、自由現金流或信用利差序列。因此這個模組不給融資壓力分數，也不以股價下跌取代信用資料。</p></div></section><section class="panel"><h2>資料品質與可重現性</h2><div id="quarantine" class="small muted"></div><details><summary>季度覆蓋（管理人數比例不是資金或市值覆蓋率）</summary><div class="table-wrap"><table><thead><tr><th>報告期</th><th>觀察管理人數</th><th>納入固定樣本</th><th>管理人數比例</th></tr></thead><tbody>${D.coverage.map(c=>`<tr><td>${c.quarter}</td><td>${fmt(c.observed_managers,0)}</td><td>${c.panel_managers}</td><td>${fmt(c.panel_manager_count_pct)}%</td></tr>`).join('')}</tbody></table></div></details><details><summary>排除理由與限制</summary><p class="small muted">各理由可能重疊，不能相加為排除總數。</p>${Object.entries(D.manager_exclusion_reasons).map(([k,v])=>`<p class="small">${esc(k)}：${v}</p>`).join('')}<ul class="small muted">${D.limitations.map(l=>`<li>${esc(l)}</li>`).join('')}</ul></details><details><summary>選定個股的 SEC 原始申報</summary><div class="source-list small" id="sources"></div></details><details><summary>更新狀態</summary><div id="refresh" class="small muted">資料計算時間 ${esc(D.generated_at)}。每日檢查不代表每日持股觀察；逐筆新增申報尚未整合，數值更新目前跟隨 SEC 批次發布。新季度及公司行動需要重新通過驗證。</div></details><div class="small"><a href="data/panel.json" download>下載數值、管理人名單與來源紀錄</a> · <a href="data/staging_audit.json">原始資料稽核</a> · <a href="https://www.sec.gov/data-research/sec-markets-data/form-13f-data-sets">SEC 官方資料</a></div></section>`;
 el('quarantine').textContent='未通過數值發布門檻：'+(D.quarantined_securities||[]).map(s=>s.ticker).join('、')+'。這些公司保留研究追蹤，但不填入估算或替代值。';el('selection').addEventListener('change',paint);document.querySelectorAll('[data-stock]').forEach(b=>b.addEventListener('click',()=>{el('selection').value=b.dataset.stock;paint();el('history').scrollIntoView({behavior:'smooth',block:'center'})}));
 const groupchanges=Object.keys(names).filter(g=>g!=='core').map(g=>{const r=series(g);return [g,100*(r.at(-1).index/r.at(-2).index-1)]});const max=Math.max(1,...groupchanges.map(x=>Math.abs(x[1])));el('rotation').innerHTML=groupchanges.map(([g,v])=>`<div class="bar-row"><span>${names[g]}</span><div class="bar-track"><div class="bar" style="width:${Math.abs(v)/max*100}%;background:${v>=0?'#7bc9bb':'#db9e93'}"></div></div><span class="${v>=0?'positive':'negative'}">${signed(v)}</span></div>`).join('');
 const c=series('core');const change=100*(c.at(-1).index/c.at(-2).index-1);el('interpretation').innerHTML=`<p>這組受限樣本的核心籃子，最新一季固定價格部位指數變化為 <b>${signed(change)}</b>。</p><p class="small muted">這是樣本內的證據；因管理人篩選偏差、主被動袖口混合與披露落後，尚不能據此判定整體機構對 AI 的信心正在增強或減弱。</p>`;paint();
 fetch('data/release_check.json').then(r=>r.ok?r.json():null).then(d=>{if(d)el('refresh').textContent+=` 最近來源檢查 ${d.checked_at}；狀態 ${d.status}；近期 13F 申報到達 ${d.recent_filing_arrivals} 筆（待整合，不是新增買入）。`}).catch(()=>{});
}
fetch('data/panel.json').then(r=>{if(!r.ok)throw Error('資料檔未取得');return r.json()}).then(d=>{if(d.status!=='validated_restricted_reporting_panel'||!d.series?.length)throw Error('資料尚未通過受限樣本驗證');D=d;render()}).catch(e=>{el('app').className='error';el('app').textContent='無法載入已驗證資料：'+e.message+'。不顯示替代或示範數字。'});
</script></body></html>
